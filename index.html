*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:Georgia,"Times New Roman","Noto Serif",serif;
  background:var(--cream); color:var(--ink);
  min-height:100dvh; line-height:1.5;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(rgba(244,241,225,.35),rgba(244,241,225,.62)),var(--img-bg) center/cover no-repeat;
}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 0 env(safe-area-inset-bottom)}
header{
  background:linear-gradient(160deg,rgba(51,61,30,.82),rgba(79,93,47,.62)),var(--img-bg) center/cover no-repeat,var(--wine-dark);
  color:var(--cream); padding:calc(env(safe-area-inset-top) + 14px) 18px 22px; position:relative;
}
.langbar{display:flex;justify-content:flex-end}
select#lang{
  appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.12);color:var(--cream);
  border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:8px 16px;font-size:15px;font-family:inherit;
}
select#lang option{color:#222}
.brand{text-align:center;margin-top:10px}
.brand h1{margin:0;font-size:34px;letter-spacing:6px;font-weight:400;text-transform:uppercase}
.brand p{margin:6px 0 0;font-size:14px;letter-spacing:2px;color:#e9e5a8;text-transform:uppercase}
.divider{width:48px;height:2px;background:var(--gold);margin:12px auto 0}
main{flex:1;padding:22px 18px 30px}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.big{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;margin:0 0 14px;
  border-radius:14px;border:1.5px solid var(--wine);background:var(--card);color:var(--wine);
  font-family:inherit;font-size:18px;padding:12px 16px;cursor:pointer;text-align:center;
}
.big.primary{background:var(--wine);color:var(--cream);font-size:19px;min-height:70px;box-shadow:0 6px 16px rgba(79,93,47,.3)}
.big:active{transform:scale(.98)}
.hello{text-align:center;margin:6px 6px 24px;font-size:17px;color:#55593f}
.back{background:none;border:none;color:var(--wine);font-family:inherit;font-size:16px;padding:6px 0;margin-bottom:10px;cursor:pointer}
h2{font-weight:400;font-size:24px;margin:4px 0 14px;color:var(--wine)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 8px}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.count{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#7c8060;margin-bottom:12px}
.opt{
  display:block;width:100%;text-align:left;margin:0 0 12px;padding:16px 18px;min-height:56px;font-size:17px;font-family:inherit;
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;color:var(--ink);cursor:pointer;
}
.opt:active,.opt.sel{border-color:var(--wine);background:#eceed0}
.nav{display:flex;gap:10px;margin-top:8px}
.nav .big{margin:0;min-height:54px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 2px;font-size:19px;font-weight:600;color:var(--wine-dark)}
.meta{font-size:13px;color:#7c8060;letter-spacing:.5px;text-transform:uppercase}
.best{border:2px solid var(--gold);padding:20px 16px}
.best h3{font-size:22px}
.badge{display:inline-block;background:var(--gold);color:#fff;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:3px 10px;border-radius:12px;margin-bottom:8px}
.chips{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border-radius:12px;background:#eceed0;color:var(--wine-dark)}
.sub{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#7c8060;margin:20px 0 10px}
.ask{text-align:center;font-size:15px;color:var(--wine);margin:18px 0 20px;font-style:italic}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:20px;border:1.5px solid var(--wine);background:transparent;color:var(--wine);font-family:inherit;font-size:15px;cursor:pointer}
.tab.on{background:var(--wine);color:var(--cream)}
.grp{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cream);background:var(--wine);padding:7px 12px;border-radius:8px;margin:18px 0 4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px dotted var(--line);font-size:16px}
.row b{font-weight:400;color:#8f811f;white-space:nowrap}
.story p{font-size:17px;margin:0 0 18px}
.tl{border-left:2px solid var(--gold);margin:10px 0 0 6px;padding-left:18px}
.tl div{margin-bottom:18px;position:relative}
.tl div::before{content:"";position:absolute;left:-25px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.tl b{display:block;color:var(--wine);font-size:17px}
.tl span{font-size:16px}
footer{text-align:center;font-size:12px;color:#7c8060;padding:14px;letter-spacing:1px}
.banner{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;margin:0 0 16px}
.banner.tall{aspect-ratio:4/5;margin:6px 0 0}
.grow{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#8f811f;margin:-6px 0 14px}
.view:not(#v-home){background:rgba(244,241,225,.92);border-radius:16px;padding:14px 14px 18px}
.hello{background:rgba(244,241,225,.88);border-radius:12px;padding:10px 12px}
footer{background:rgba(244,241,225,.85)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="langbar"><select id="lang" aria-label="Language"></select></div>
    <div class="brand">
      <h1>Ventozelo</h1>
      <p id="tagline"></p>
      <div class="divider"></div>
    </div>
  </header>

  <main>
    <section class="view active" id="v-home">
      <p class="hello" id="hello"></p>
      <button class="big primary" id="b-quiz"></button>
      <button class="big" id="b-menu"></button>
      <button class="big" id="b-story"></button>
    </section>

    <section class="view" id="v-quiz">
      <button class="back" data-back></button>
      <div class="count" id="qcount"></div>
      <div class="progress"><i id="qbar"></i></div>
      <h2 id="qtitle"></h2>
      <div id="qopts"></div>
      <div class="nav"><button class="big" id="qprev"></button></div>
    </section>

    <section class="view" id="v-result">
      <button class="back" data-back></button>
      <h2 id="rtitle"></h2>
      <p class="hello" id="rsub" style="text-align:left;margin:0 0 16px"></p>
      <div id="rlist"></div>
      <p class="ask" id="rask"></p>
      <button class="big" id="rrestart"></button>
    </section>

    <section class="view" id="v-menu">
      <button class="back" data-back></button>
      <h2 id="mtitle"></h2>
      <img class="banner" id="menuimg" alt="">
      <div class="tabs" id="mtabs"></div>
      <div id="mlist"></div>
    </section>

    <section class="view story" id="v-story">
      <button class="back" data-back></button>
      <h2 id="stitle"></h2>
      <div id="stext"></div>
    </section>
  </main>
  <footer>Quinta de Ventozelo · Douro · Portugal</footer>
</div>

<script>
/* =========================================================
   1) CARTA DE VINOS (precios y nombres de la carta de Ventozelo)
   Cada fila: [nombre, precio, "etiquetas", 1 = no recomendar en el cuestionario]
   La primera etiqueta es el tipo: white | rose | red | sparkling | port | sweet
   Los vinos de más de 250 € nunca se recomiendan en el cuestionario (siguen en el menú).
   ========================================================= */
const WINES = [];
const G = (prod, rows) => rows.forEach(r => {
  const tags = r[2].split(" ");
  WINES.push({prod, name:r[0], price:r[1], tags, type:tags[0], skip: !!r[3] || r[1] > 250});
});
const QV = "Quinta de Ventozelo ";

G("Quinta de Ventozelo", [

  stitle:"我们的故事",
  grow:"我们如何成长",
  intro:"Ventozelo 酒庄是杜罗河谷最大、最古老的庄园之一，自 1288 年起便有文献记载。七个多世纪以来，它从一个务农和林业的村落，发展成今天集葡萄酒、橄榄油、可持续发展与葡萄酒旅游于一体的项目。",
  tl:[
   ["1288","在国王迪尼斯的调查记录中首次出现 Ventozelo，当时是与 Roriz 相关联的村落，所在地区深受熙笃会修士农耕活动的影响。"],
   ["约 1500 年","经圣佩德罗·达斯阿吉亚斯熙笃会修道院出租，产业转到拉梅古波索府（Casa do Poço）贵族手中，他们将其建成酒庄（Quinta），并先后签订多份租约（1680、1740、1806 年）。"],
   ["16–18 世纪","葡萄园投入有限，土地主要用作狩猎场，并粗放种植橄榄、谷物和漆树。"],
   ["1840","建成 1840 酒窖（Armazém 1840），其中仍保留着与庄园酿酒历史相关的古老花岗岩踩葡萄池。"],
   ["20 世纪初","庄园离开波索府家族，几经易主，期间有过现代化尝试，但经营并不总是盈利。"],
   ["2014","Granvinhos / Gran Cruz 集团（La Martiniquaise）收购 Ventozelo，开启农业、环境与旅游的复兴计划。"],
   ["今天","在第一个十年里投入约 1500 万欧元，庄园占地约 400 公顷，其中约 200 公顷为葡萄园，其余是大片地中海森林与生物多样性保护区，将杜罗葡萄酒、波特酒和橄榄油与酒店、步道、菜园和葡萄酒旅游融为一体。"]
  ],
  q:[
   {t:"您是喜欢酸度的人吗？想想刚榨的柠檬或青苹果。",o:["是的，越鲜活清爽越好","喜欢一点，但不要刺口","我更喜欢柔和圆润，不要尖锐"]},
   {t:"甜美的味道会让您感到舒心吗？",o:["不，我喜欢干爽清澈","只要成熟水果的天然甜味","是的，甜点是我最爱的部分"]},
   {t:"开一瓶酒的完美时间和地点是？",o:["派对上，与朋友举杯","阳光明媚的下午，面朝葡萄园","一顿悠长的晚餐，配炭烤肉","夜深时分，不赶时间，不看钟表"]},
   {t:"您希望酒在口中的感觉是怎样的？",o:["轻盈多汁，易于入口","丝滑包裹，如天鹅绒","坚实有个性，存在感强","浓郁悠长，久久不散"]},
   {t:"如果您的理想葡萄酒是一个人，您会如何形容TA？",o:["平和温柔的人", "开朗，又有点爆发力", "坚强有个性，但内心温柔", "细腻浪漫，用细节打动人心", "神秘优雅，有说不完的故事"]}
  ]},

  intro:"キンタ・デ・ヴェントゾーロは、ドウロでも最大級かつ最も古い農園のひとつで、1288年から文書に記録が残っています。7世紀以上のあいだに、農業と林業の村から、ワイン、オリーブオイル、サステナビリティ、ワインツーリズムを軸とする現在のプロジェクトへと発展してきました。",
  tl:[
   ["1288","ディニス王の調査記録に、ロリスと結びついた村としてヴェントゾーロが初めて登場。シトー会修道士の農業活動が盛んな地域でした。"],
   ["1500年頃","サン・ペドロ・ダス・アギアス修道院（シトー会）の永代貸借により、レイメゴのカーザ・ド・ポソ家の貴族の手に渡り、「キンタ」として確立。1680年、1740年、1806年と貸借証書が続きました。"],
   ["16〜18世紀","ブドウ栽培への投資は少なく、主に狩猟用の保護地として、またオリーブ、穀物、ウルシの粗放的な栽培地として使われました。"],
   ["1840","「アルマゼン1840」が建てられ、農園のワイン造りの歴史を物語る古い花崗岩のラガールが今も残っています。"],
   ["20世紀初頭","カーザ・ド・ポソ家の手を離れ、何人もの所有者を経て、近代化の試みもありましたが、経営は必ずしも順調ではありませんでした。"],
   ["2014","グランヴィニョス／グラン・クルス・グループ（ラ・マルティニケーズ）が取得し、農業・環境・観光の再生計画が始まりました。"],
   ["現在","最初の10年間で約1,500万ユーロを投資。約400ヘクタールの敷地のうち、約200ヘクタールがブドウ畑で、残りは地中海性の森と豊かな生物多様性の地域。ドウロワイン、ポートワイン、オリーブオイルの生産に加え、ホテル、トレイル、菜園、ワインツーリズムを展開しています。"]
  ],

   {t:"甘い味わいは心を和ませてくれますか？",o:["いいえ、辛口ですっきりが好き","熟した果実の自然な甘みだけ","はい、デザートが一番の楽しみ"]},
   {t:"ワインを開けるのに最高の場所とタイミングは？",o:["パーティーで、友人と乾杯","陽ざしの午後、ブドウ畑を眺めながら","炭火焼きの肉を囲む長いディナー","夜更け、急がず時計も気にせず"]},

/* =========================================================
   4) LÓGICA
   ========================================================= */
const $ = id => document.getElementById(id);
let lang = "es", step = 0, answers = [], menuFilter = "all", current = "home";

(function(){
  let s = null; try{ s = localStorage.getItem("vz-lang"); }catch(e){}
  const n = (navigator.language||"es").slice(0,2);
  lang = TEXT[s] ? s : (TEXT[n] ? n : "es");
})();

const sel = $("lang");
Object.keys(LANGS).forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=LANGS[k]; sel.appendChild(o); });
sel.value = lang;
sel.addEventListener("change", ()=>{ lang = sel.value; try{localStorage.setItem("vz-lang",lang)}catch(e){} render(); });

function show(v){
  current = v;
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
  $("v-"+v).classList.add("active");
  window.scrollTo({top:0});
  render();
}
document.querySelectorAll("[data-back]").forEach(b=>b.addEventListener("click",()=>show("home")));
const startQuiz = ()=>{ step=0; answers=[]; show("quiz"); };
$("b-quiz").onclick = startQuiz;
$("b-menu").onclick = ()=>show("menu");
$("b-story").onclick = ()=>show("story");
$("qprev").onclick = ()=>{ if(step>0){ step--; answers.length=step; renderQuiz(); } else show("home"); };
$("rrestart").onclick = startQuiz;

function render(){
  const t = TEXT[lang];
  document.documentElement.lang = lang;
  $("tagline").textContent = t.tagline;
  $("hello").textContent = t.hello;
  $("b-quiz").textContent = t.quiz;
  $("b-menu").textContent = t.menu;
  $("b-story").textContent = t.story;
  document.querySelectorAll("[data-back]").forEach(b=>b.textContent=t.back);
  $("qprev").textContent = t.prev;
  $("rrestart").textContent = t.restart;
  if(current==="quiz") renderQuiz();
  if(current==="result") renderResult();
  if(current==="menu") renderMenu();
  if(current==="story") renderStory();
}

function renderQuiz(){
  const t = TEXT[lang], total = QUIZ.length, q = t.q[step];
  $("qcount").textContent = t.qn(step+1,total);
  $("qbar").style.width = (step/total*100)+"%";
  $("qtitle").textContent = q.t;
  const box = $("qopts"); box.innerHTML = "";
  q.o.forEach((label,i)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = label;
    b.onclick = ()=>{
      b.classList.add("sel");
      answers[step] = i;
      setTimeout(()=>{
        if(step < total-1){ step++; renderQuiz(); window.scrollTo({top:0}); }
        else show("result");
      },160);
    };
    box.appendChild(b);
  });
}

/* Puntuación de un vino según las respuestas */
function weights(w){
  const m = {};
  answers.forEach((a,i)=>{
    const opt = QUIZ[i][a] || {};
    Object.keys(opt).forEach(tag=>{ if(w.tags.includes(tag)) m[tag] = (m[tag]||0) + opt[tag]; });
  });
  return m;
}
const score = w => Object.values(weights(w)).reduce((a,b)=>a+b,0);

/* Recomendación: el vino principal es el MÁS CARO entre los que mejor encajan (≥90 % de la mejor puntuación).
   Los otros 2 son los siguientes mejores, evitando vinos con el mismo perfil. */
function recommend(){
  const pool = WINES.filter(w=>!w.skip).map(w=>({w, s:score(w)}));
  const top = Math.max(...pool.map(x=>x.s));
  const good = pool.filter(x=>x.s >= top*0.9).sort((a,b)=>b.w.price-a.w.price || b.s-a.s);
  const first = good[0];
  const rest = pool.filter(x=>x!==first).sort((a,b)=>b.s-a.s || b.w.price-a.w.price);
  const picks = [first], seen = new Set([first.w.type+first.w.tags.join()]);
  for(const x of rest){
    if(picks.length===3) break;
    const sig = x.w.type+x.w.tags.join();
    if(!seen.has(sig)){ picks.push(x); seen.add(sig); }
  }
  for(const x of rest){ if(picks.length===3) break; if(!picks.includes(x)) picks.push(x); }
  return picks.map(x=>x.w);
}

function resultCard(w, best){
  const t = TEXT[lang];
  const m = weights(w);
  const chips = Object.keys(m).filter(k=>!TYPE_TAGS.includes(k)).sort((a,b)=>m[b]-m[a]).slice(0,3);
  return `<div class="card ${best?"best":""}">
    ${best?`<span class="badge">${t.best}</span>`:""}
    <h3>${w.name}</h3>
    <div class="meta">${t.types[w.type]}</div>
    <div class="chips">${chips.map(c=>`<span class="chip">${t.tags[c]}</span>`).join("")}</div>
  </div>`;
}

function renderResult(){
  const t = TEXT[lang];
  $("rtitle").textContent = t.rtitle;
  $("rsub").textContent = t.rsub;
  $("rask").textContent = t.ask;
  const [a,b,c] = recommend();
  $("rlist").innerHTML = resultCard(a,true) + `<div class="sub">${t.also}</div>` + resultCard(b) + resultCard(c);
}

const fmt = p => p.toFixed(2).replace(".",",") + " €";
function renderMenu(){
  const t = TEXT[lang];
  $("mtitle").textContent = t.menu;
  $("menuimg").src = IMG.terrace;
  const keys = ["all","white","rose","red","sparkling","port","sweet"];
  $("mtabs").innerHTML = keys.map(k=>
    `<button class="tab ${menuFilter===k?"on":""}" data-k="${k}">${k==="all"?t.all:t.types[k]}</button>`).join("");
  $("mtabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ menuFilter=b.dataset.k; renderMenu(); });
  let html = "", lastProd = "";
  WINES.filter(w=>menuFilter==="all"||w.type===menuFilter).forEach(w=>{
    if(w.prod !== lastProd){ html += `<div class="grp">${w.prod}</div>`; lastProd = w.prod; }
    html += `<div class="row"><span>${w.name}</span><b>${fmt(w.price)}</b></div>`;
  });
  $("mlist").innerHTML = html;
}

function renderStory(){
  const t = TEXT[lang];
  $("stitle").textContent = t.stitle;
  $("stext").innerHTML = `<div class="grow">${t.grow}</div><img class="banner" src="${IMG.dining}" alt=""><p>${t.intro}</p><div class="tl">` +
    t.tl.map(r=>`<div><b>${r[0]}</b><span>${r[1]}</span></div>`).join("") + `</div><img class="banner tall" src="${IMG.pool}" alt="">`;
}

render();
</script>
